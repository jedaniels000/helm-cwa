name: Lint, Test, and Document

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  lint-test-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Required for chart-testing to compare against main
          fetch-depth: 0

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@v2
        with:
          chart-search-root: charts

      - name: Commit updated documentation
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        with:
          commit_message: "chore: auto-generate helm documentation"
          file_pattern: 'charts/**/README.md'

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0

      # chart-testing depends on Python for yamllint and yamale
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Set up Chart Testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Fetch base branch
        run: run: git fetch origin ${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}

      # Check if charts changed to avoid unnecessary cluster creation
      - name: Check for changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Charts changed: $changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No chart changes detected. Skipping lint and install."
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --check-version-increment=false

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

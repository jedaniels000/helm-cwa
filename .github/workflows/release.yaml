name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # semantic-release requires full git history to analyze
          # commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4.1.0
        with:
          # Installs the extra plugins requested in `.releaserc.json`
          extra_plugins: |
            @semantic-release/changelog
            semantic-release-helm
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart to OCI
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          echo "Publishing version $VERSION to GHCR OCI"

          mkdir -p .cr-release-packages

          helm package charts/* --version "$VERSION" --app-version "$VERSION" -d .cr-release-packages

          for pkg in .cr-release-packages/*.tgz; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
